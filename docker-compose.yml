name: agents

services:
  vllm:
    image: ${IMAGE}
    container_name: vllm
    ipc: host
    # You may need to adjust seccomp settings for vLLM depending on your environment and use case
    security_opt:
      - seccomp=unconfined
    command:
      - ${HF_MODEL_NAME}
      - --served-model-name=${SERVED_MODEL_NAME}
      - --host=${VLLM_ADDR}
      - --port=${VLLM_PORT}
      - --tensor-parallel-size=1
      - --kv-cache-dtype=fp8
      - --async-scheduling
      - --max-model-len=${CONTEXT_LEN}
      - --linear-backend=${LINEAR_BE}
      - --hf-overrides={"rope_scaling":{"rope_type":"yarn","factor":${YARN_FACTOR},"original_max_position_embeddings":$ORIGINAL_MAX_POS_EMBEDDS}}
      - --gpu-memory-utilization=${GPU_MEM_UTIL}
      - --max-num-seqs=${MAX_NUM_SEQS}
      - --max-num-batched-tokens=${MAX_NUM_BATCHED_TOKENS}
      - --reasoning-parser=${REASONING_PARSER}
      - --tool-call-parser=${TOOL_CALL_PARSER}
      - --enable-auto-tool-choice
      - --attention-backend=${ATTENTION_BE}
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --moe-backend=${MOE_BE}
      - --load-format=fastsafetensors
      - --compilation-config={"cudagraph_mode":"PIECEWISE"}
      - --max-cudagraph-capture-size=${MAX_CUDAGRAPH_CAPTURE_SIZE}
      - --speculative-config={"method":"mtp","num_speculative_tokens":${NUM_SPEC_TOKENS},"moe_backend":"triton"}
      - --limit-mm-per-prompt={"image":0,"video":0}
      - --trust-remote-code
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      # Ignored in this setup, but worth keeping for when b12x is fixed
      - CUTE_DSL_ARCH=sm_121a
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: all
    ports:
      - ${VLLM_ADDR}:${VLLM_PORT}:${VLLM_PORT}
    volumes:
      - $WD:/var/workspace
      - $VLLM_CACHE_DIR:/root/.cache
    networks:
      agents:

networks:
  agents:
    name: agents-network
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1
